[project]
name = "forjio-locavello"
version = "0.1.0"
description = "Locavello SDK — typed Python client for the locavello.forjio.com REST API. Sister to the JS + Go SDKs."
authors = [{ name = "Forjio", email = "support@forjio.com" }]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://locavello.forjio.com/docs/sdk/python"
Repository = "https://github.com/hachimi-cat/saas-locavello"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forjio_locavello"]
