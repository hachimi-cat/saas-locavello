name: CI/CD

# Locavello deploys through DEPLLO, not GitHub Actions — the GHA quota is the
# whole reason Depllo exists. The push/PR triggers are deliberately removed
# so this workflow never auto-fires; it stays as a manually-dispatchable
# fallback for the day Depllo is down. Do not re-enable them.
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate visual regression baselines on this branch and commit them back. Use after an intentional marketing chrome change.'
        type: boolean
        default: false

# Serialize per branch so stacked commits don't fire multiple parallel deploys
# against the staging/prod servers. cancel-in-progress=false because we want
# every push to still reach prod — just in order, not in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend type check
        run: cd backend && npm ci && npm run type-check
      - name: Frontend lint
        run: cd frontend && npm ci && npm run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    # Independent of lint — they only share `checkout`. Running in parallel
    # cuts ~45s off the pipeline.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          # Lowercase snake placeholder — rename.sh rewrites `locavello`
          # to the product's snake id (uppercase placeholders here produced
          # an UPPERCASE db name after rename; template bug found spawning
          # suppuo).
          POSTGRES_DB: locavello_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend tests
        run: |
          cd backend && npm ci
          DATABASE_URL=postgresql://postgres:test@localhost:5432/locavello_test \
            npx prisma migrate deploy
          DATABASE_URL=postgresql://postgres:test@localhost:5432/locavello_test \
            REDIS_URL=redis://localhost:6379 \
            JWT_SECRET=test-secret JWT_REFRESH_SECRET=test-refresh-secret \
            npm test
      - name: Frontend tests
        run: cd frontend && npm ci && npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    # The single source of truth for build artifacts. All NEXT_PUBLIC_* env
    # vars are inlined here once and the artifact is reused by both staging
    # and prod deploys. The frontend is a DYNAMIC Next app (BFF session
    # portal, admin console proxy) — ship `.next/` and run `next start` on
    # the droplet, NOT a static export. NEXT_PUBLIC_API_URL is left as the
    # default `/api/v1` (relative) so the same build works on both staging
    # and prod — nginx proxies /api/v1 to the backend on both hosts.
    # Server-side env vars (HUUDIS_*, MIDTRANS_*, etc.) are read at runtime
    # from droplet .env and don't require a rebuild when they change.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build backend
        run: cd backend && npm ci && npx prisma generate && npm run build
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          # Cloudflare Turnstile ("Forjio Daily Auth" widget, forjio.com and its
          # subdomains). A site key is public by design: it is in every login page.
          # The backend verifies with TURNSTILE_SECRET_KEY (@forjio/sdk >= 0.10).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADq51t0tvcSO5mFW
        run: cd frontend && npm ci && npm run build
      - name: Upload backend dist
        uses: actions/upload-artifact@v6
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          # Dynamic Next app — ship `.next/` and run `next start` on the
          # droplet (the pawpado/ripllo model).
          name: frontend-out
          # CRITICAL: .next is a dotdir — upload-artifact skips hidden
          # files by default, which silently ships an artifact with NO
          # build (template bug found spawning suppuo).
          include-hidden-files: true
          path: |
            frontend/.next/
            frontend/public/
            frontend/package.json
            frontend/package-lock.json
            frontend/next.config.*

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Gates on e2e-staging + visual-regression. Previous setting
    # decoupled e2e from prod ("E2E is advisory") was reverted
    # 2026-05-09 per bang's "all CI = huudis" directive.
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.repository != 'hachimi-cat/forjio-service-template'
    steps:
      # Reuses the artifact from the Build job — no re-checkout, no rebuild.
      # The staging artifact IS the production artifact since NEXT_PUBLIC_API_URL
      # is set to the relative `/api/v1` (works on both hosts) and the only
      # other NEXT_PUBLIC_* value (Midtrans client key) is the same across envs.
      - uses: actions/download-artifact@v7
        with:
          name: backend-dist
          path: backend/
      - uses: actions/download-artifact@v7
        with:
          name: frontend-out
          path: frontend/
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude node_modules --exclude .git --exclude .env --exclude .npmrc --exclude frontend/.next/cache
          path: ./
          remote_path: /opt/saas/locavello/
          remote_host: ${{ secrets.PRODUCTION_HOST }}
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Migrate + restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/saas/locavello/backend
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart locavello || pm2 start dist/index.js --name locavello -i 1
            cd /opt/saas/locavello/frontend
            # Dynamic Next app — `.next/` pre-built in the artifact.
            npm ci --omit=dev
            pm2 restart locavello-frontend || pm2 start npm --name locavello-frontend -- start
            pm2 save

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.event.head_commit.message, 'v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extract version
        id: ver
        run: |
          VER=$(echo "${{ github.event.head_commit.message }}" | grep -oP '^v\d+\.\d+\.\d+' || echo "")
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        if: steps.ver.outputs.version
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --title "${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --target ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish CLI if changed
        if: steps.ver.outputs.version
        run: |
          if git diff --name-only HEAD~1 2>/dev/null | grep -q '^cli/'; then
            cd cli
            npm version patch --no-git-tag-version 2>/dev/null || true
            npm publish --access public 2>/dev/null || echo "CLI publish skipped"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
